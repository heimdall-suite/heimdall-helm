; PlatformIO project config -- heimdall-helm
;
; framework = stm32cube, deliberately NOT arduino: raw HAL/LL, no Arduino
; core, no digitalWrite()/HardwareSerial abstraction layer to fight (see
; aoa-boat-controller's platformio.ini for the class of pain that avoids --
; patched framework IRQ handlers, wrong HAL clock-speed defaults baked into
; the Arduino board template). This project owns SystemClock_Config() and
; peripheral init directly, in boards/<target>/board.c.
;
; Multi-target structure: boards/<target>/ holds board-specific wiring
; (clock config, pin map, board_features.h capability flags) and is a
; SIBLING of src/, not nested inside it -- PlatformIO's build_src_filter
; only scopes src_dir, so it can't select boards/<target>/board.c the way
; aoa-boat-controller's per-target src/<Target>/ split did. Instead,
; scripts/add_board.py explicitly compiles just the one board.c this env
; names via custom_helm_board, the same explicit-control pattern already
; used for vendor/freertos-kernel (see add_freertos.py) rather than
; fighting PlatformIO's LDF auto-discovery -- see that project's own
; platformio.ini comments for the "LDF only scans immediate children,
; silently drops nested folders" trap this sidesteps entirely.
;
; FreeRTOS is vendored under vendor/freertos-kernel/ (not a PlatformIO
; registry lib -- see that folder's README for why) and wired in via
; add_freertos.py, per-env parameterized by custom_helm_freertos_port
; (which Cortex-M port) and custom_helm_fpu_flags (FPU flags, empty for
; the Afroflight32's Cortex-M3, which has no FPU). custom_helm_fpu_flags is
; the ONLY place FPU flags are declared -- add_freertos.py applies it to
; both CCFLAGS and LINKFLAGS itself; do not also add -mfpu/-mfloat-abi to
; an env's build_flags below, or the two can drift out of sync (see
; add_freertos.py's own comment for why that's not hypothetical).
;
; lib/rx/ (sbus.c, crsf.c) is a NEW case of the same collision class:
; unlike a per-board split, both files implement the SAME function names
; (rx_init/rx_update/rx_get_latest -- two implementations of one
; interface, see lib/rx/rx.h), so PlatformIO's default lib/ auto-scan
; would try to compile both into every board and collide at link time.
; lib_ignore = rx (every env, below) opts lib/rx/ out of that auto-scan
; entirely; scripts/add_rx.py explicitly compiles only the one protocol
; this env names via custom_helm_rx (plus lib/rx/shared/, always). Any
; future subsystem with more than one same-interface implementation
; (lib/imu/, lib/baro/ once real drivers land) will need the same
; treatment -- see lib/README.md.

[env:matek_h743]
platform = ststm32
board = devebox_h743vitx
framework = stm32cube
; upload_protocol = dfu: this board's own bootloader.c/cli.c (see
; lib/bootloader, lib/cli) can reboot straight into the STM32 ROM's USB
; DFU bootloader from a CLI command (`bl`/`dfu`), no BOOT-button/ST-Link
; needed -- see boards/matek_h743/usbd_conf.c's own header comment for
; why. platform-ststm32's dfu-util upload path (builder/main.py) works
; regardless of what this board's own board.json "protocols" list says;
; PlatformIO fetches its own tool-dfuutil package on first use.
upload_protocol = dfu
build_flags =
    -Iboards/matek_h743
    ; This board's real 8MHz HSE -- devebox_h743vitx's HAL default assumes
    ; 25MHz (bench-confirmed wrong for this board; see board.c's clock
    ; config comment). Needed so every HAL macro that computes a frequency
    ; from HSE_VALUE (not just the PLL hardware registers board.c sets
    ; directly) agrees with reality.
    -D HSE_VALUE=8000000U
custom_helm_board = matek_h743
custom_helm_freertos_port = ARM_CM7/r0p1
custom_helm_fpu_flags = -mfpu=fpv5-d16 -mfloat-abi=hard
custom_helm_rx = sbus
; custom_helm_bootloader/custom_helm_usb_cdc: only this board has an
; implementation so far (STM32H7-specific -- see lib/bootloader/stm32h7.c
; and lib/usb_cdc/stm32h7.c's own comments for why afroflight32/nexus_xr
; don't just reuse them).
custom_helm_bootloader = stm32h7
custom_helm_usb_cdc = stm32h7
; One name per line, not space-separated on one line -- PlatformIO's ini
; list parser (GetProjectOption) only splits multi-value options on
; newlines/commas, so "rx bootloader usb_cdc" on one line becomes a
; single-element list ["rx bootloader usb_cdc"], which never matches any
; real library name and silently ignores nothing (bench-confirmed: this
; exact one-line form let LDF pull lib/bootloader + lib/usb_cdc into
; afroflight32's build anyway, breaking it against the wrong HAL).
lib_ignore =
    rx
    bootloader
    usb_cdc
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_rx.py
    pre:scripts/add_bootloader.py
    pre:scripts/add_usb_cdc.py

[env:afroflight32]
platform = ststm32
board = genericSTM32F103CB
framework = stm32cube
build_flags =
    -Iboards/afroflight32
    ; This board's real 12MHz HSE, owner-confirmed against the physical
    ; unit -- genericSTM32F103CB's variant never defines HSE_VALUE at all,
    ; silently falling back to HAL's generic 8MHz default otherwise (see
    ; board.c's clock config comment).
    -D HSE_VALUE=12000000U
custom_helm_board = afroflight32
custom_helm_freertos_port = ARM_CM3
custom_helm_fpu_flags =
custom_helm_rx = sbus
; bootloader/usb_cdc: no implementation for F103 yet (would need its own
; from-real-source derivation and bench verification, same standard as
; every other register-level decision here -- see lib/bootloader/
; stm32h7.c's header comment). Kept in lib_ignore anyway so LDF never
; tries to auto-scan those folders for this board -- one name per line,
; see matek_h743's own comment on why (space-separated on one line
; silently ignores nothing).
lib_ignore =
    rx
    bootloader
    usb_cdc
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_rx.py

; Not yet buildable on purpose: boards/nexus_xr/board.c #errors rather
; than guess at an unconfirmed HSE crystal value or pin map. See that
; file and boards/nexus_xr/board.h for what's actually known vs.
; speculative. Env kept here so the target is structurally present (repo
; supports it, `pio run -e nexus_xr` finds it) without pretending a real
; port exists yet.
[env:nexus_xr]
platform = ststm32
board = nucleo_f722ze ; placeholder: correct MCU FAMILY (STM32F722, same
                      ; family as the real STM32F722RET6) and correct HAL
                      ; (stm32f7xx), but a different package (ZET6 vs the
                      ; real RET6) and NOT the real board -- no PlatformIO
                      ; board def exists for the actual Nexus-XR. Swap for
                      ; a real/custom board JSON once pin/clock data is
                      ; confirmed.
framework = stm32cube
build_flags =
    -Iboards/nexus_xr
custom_helm_board = nexus_xr
custom_helm_freertos_port = ARM_CM7/r0p1
custom_helm_fpu_flags = -mfpu=fpv5-sp-d16 -mfloat-abi=hard
; CRSF, not SBUS -- the XR's onboard ExpressLRS receiver uses CRSF framing
; (see boards/nexus_xr/board.h and aoa-boat-controller's
; docs/nexus-xr-exploration.md). This is why RX had to be pluggable per
; board in the first place, not hardcoded to matek_h743/afroflight32's
; SBUS.
custom_helm_rx = crsf
; bootloader/usb_cdc: not ported to STM32F722 either -- see afroflight32's
; own comment above.
lib_ignore =
    rx
    bootloader
    usb_cdc
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_rx.py

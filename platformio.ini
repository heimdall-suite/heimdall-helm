; PlatformIO project config -- heimdall-helm
;
; framework = stm32cube, deliberately NOT arduino: raw HAL/LL, no Arduino
; core, no digitalWrite()/HardwareSerial abstraction layer to fight (see
; aoa-boat-controller's platformio.ini for the class of pain that avoids --
; patched framework IRQ handlers, wrong HAL clock-speed defaults baked into
; the Arduino board template). This project owns SystemClock_Config() and
; peripheral init directly.
;
; FreeRTOS is vendored under vendor/freertos-kernel/ (not a PlatformIO
; registry lib -- see that folder's README for why) and wired in via
; scripts/add_freertos.py, an extra_script in the same style
; aoa-boat-controller already used for framework patching.
;
; -mfpu=fpv5-d16 -mfloat-abi=hard: the STM32H743's FPU (single+double
; precision). Required for the FreeRTOS ARM_CM7 port, which hard-errors at
; compile time without hardware float support enabled (bench-confirmed
; during bring-up) -- also needs to be added to LINKFLAGS explicitly, not
; just build_flags/CCFLAGS, or the final link fails with "uses VFP register
; arguments" mismatches against object files that don't have it (also
; bench-confirmed); see add_freertos.py for the LINKFLAGS half of this.
[env:matek_h743]
platform = ststm32
board = devebox_h743vitx
framework = stm32cube
build_flags =
    -mfpu=fpv5-d16
    -mfloat-abi=hard
extra_scripts = pre:scripts/add_freertos.py

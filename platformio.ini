; PlatformIO project config -- heimdall-helm
;
; framework = stm32cube, deliberately NOT arduino: raw HAL/LL, no Arduino
; core, no digitalWrite()/HardwareSerial abstraction layer to fight (see
; aoa-boat-controller's platformio.ini for the class of pain that avoids --
; patched framework IRQ handlers, wrong HAL clock-speed defaults baked into
; the Arduino board template). This project owns SystemClock_Config() and
; peripheral init directly, in boards/<target>/board.c.
;
; Multi-target structure: boards/<target>/ holds board-specific wiring
; (clock config, pin map, board_features.h capability flags) and is a
; SIBLING of src/, not nested inside it -- PlatformIO's build_src_filter
; only scopes src_dir, so it can't select boards/<target>/board.c the way
; aoa-boat-controller's per-target src/<Target>/ split did. Instead,
; scripts/add_board.py explicitly compiles just the one board.c this env
; names via custom_helm_board, the same explicit-control pattern already
; used for vendor/freertos-kernel (see add_freertos.py) rather than
; fighting PlatformIO's LDF auto-discovery -- see that project's own
; platformio.ini comments for the "LDF only scans immediate children,
; silently drops nested folders" trap this sidesteps entirely.
;
; FreeRTOS is vendored under vendor/freertos-kernel/ (not a PlatformIO
; registry lib -- see that folder's README for why) and wired in via
; add_freertos.py, per-env parameterized by custom_helm_freertos_port
; (which Cortex-M port) and custom_helm_fpu_flags (FPU flags, empty for
; the Afroflight32's Cortex-M3, which has no FPU). custom_helm_fpu_flags is
; the ONLY place FPU flags are declared -- add_freertos.py applies it to
; both CCFLAGS and LINKFLAGS itself; do not also add -mfpu/-mfloat-abi to
; an env's build_flags below, or the two can drift out of sync (see
; add_freertos.py's own comment for why that's not hypothetical).
;
; lib/rx/ (sbus.c, crsf.c) is the EXCEPTION to that template, not a new
; case of it: RX protocol is a user-facing mode over the same UART pin,
; not a hardware fact, so both files compile in unconditionally via
; PlatformIO's default lib/ auto-scan (no lib_ignore, no custom_helm_rx)
; -- each exposes its own uniquely-named accessor (rx_sbus_driver()/
; rx_crsf_driver(), see lib/rx/rx.h) returning an rx_driver_t vtable, so
; there's no link-time collision the way a shared-function-name split
; would have. Which one actually runs is picked at runtime by rx_start()
; (lib/rx/rx.c), defaulting to board_features.h's
; HELM_RX_DEFAULT_PROTOCOL_SBUS/_CRSF until params-persist lands. See
; lib/README.md's addendum and .docs/architecture/module-architecture.md's
; case study for the full reasoning. lib/sensors/ is now a real instance
; of the hardware-fact template instead (issue #26): its custom_helm_imu
; + scripts/add_sensors.py select one IMU chip file per board
; (icm42688p.c/mpu6500.c/stub.c), the same lib_ignore +
; custom_helm_<subsystem> + add_<subsystem>.py shape as lib/bootloader/
; and lib/usb_cdc/ below. A future lib/baro/ split (once a real baro
; driver lands) wants the same template again.

[env:matek_h743]
platform = ststm32
board = devebox_h743vitx
framework = stm32cube
; upload_protocol = dfu: this board's own bootloader.c/cli.c (see
; lib/bootloader, lib/cli) can reboot straight into the STM32 ROM's USB
; DFU bootloader from a CLI command (`bl`/`dfu`), no BOOT-button/ST-Link
; needed -- see boards/matek_h743/usbd_conf.c's own header comment for
; why. platform-ststm32's dfu-util upload path (builder/main.py) works
; regardless of what this board's own board.json "protocols" list says;
; PlatformIO fetches its own tool-dfuutil package on first use.
upload_protocol = dfu
build_flags =
    -Iboards/matek_h743
    ; This board's real 8MHz HSE -- devebox_h743vitx's HAL default assumes
    ; 25MHz (bench-confirmed wrong for this board; see board.c's clock
    ; config comment). Needed so every HAL macro that computes a frequency
    ; from HSE_VALUE (not just the PLL hardware registers board.c sets
    ; directly) agrees with reality.
    -D HSE_VALUE=8000000U
custom_helm_board = matek_h743
custom_helm_freertos_port = ARM_CM7/r0p1
custom_helm_fpu_flags = -mfpu=fpv5-d16 -mfloat-abi=hard
; custom_helm_bootloader/custom_helm_usb_cdc: STM32H7-specific
; implementations (see lib/bootloader/stm32h7.c and lib/usb_cdc/stm32h7.c's
; own comments for why afroflight32/nexus_xr don't just reuse them --
; afroflight32 has its own usb_cdc port as of #12, see that env below).
custom_helm_bootloader = stm32h7
custom_helm_usb_cdc = stm32h7
; scripts/add_usb_cdc.py needs to know which PlatformIO framework package
; (one per chip family) actually ships the ST USB Device middleware it
; explicitly compiles -- can't be hardcoded to one package name once more
; than one chip has a usb_cdc port (#12 added afroflight32's).
custom_helm_stm32cube_package = framework-stm32cubeh7
; This board's real onboard IMU (issue #26) -- see lib/sensors/
; icm42688p.c and board.h's board_imu_spi_*() comment.
custom_helm_imu = icm42688p
; One name per line, not space-separated on one line -- PlatformIO's ini
; list parser (GetProjectOption) only splits multi-value options on
; newlines/commas, so "bootloader usb_cdc" on one line becomes a
; single-element list ["bootloader usb_cdc"], which never matches any
; real library name and silently ignores nothing (bench-confirmed: this
; exact one-line form let LDF pull lib/bootloader + lib/usb_cdc into
; afroflight32's build anyway, breaking it against the wrong HAL). lib/rx/
; is deliberately NOT in this list -- see this file's header comment.
lib_ignore =
    bootloader
    usb_cdc
    sensors
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_bootloader.py
    pre:scripts/add_usb_cdc.py
    pre:scripts/add_sensors.py

[env:afroflight32]
platform = ststm32
board = genericSTM32F103CB
framework = stm32cube
; genericSTM32F103CB's board.json defaults upload_protocol to "stlink",
; which this board doesn't have wired -- flashing goes over the onboard
; USB-serial converter chip against the STM32's built-in UART ROM
; bootloader instead (BOOT0 strapped high, same manual step needed to
; reach it as a CLI command would use on matek_h743, see
; boards/afroflight32/board_features.h's HELM_HAS_ROM_BOOTLOADER_DFU
; comment). 115200, not some higher speed: aoa-boat-controller's own
; confirmed-working value for this exact board/converter pairing
; (upload_speed there, see #12/#13's history), not picked fresh here.
upload_protocol = serial
upload_speed = 115200
build_flags =
    -Iboards/afroflight32
    ; This board's real 12MHz HSE, owner-confirmed against the physical
    ; unit -- genericSTM32F103CB's variant never defines HSE_VALUE at all,
    ; silently falling back to HAL's generic 8MHz default otherwise (see
    ; board.c's clock config comment).
    -D HSE_VALUE=12000000U
custom_helm_board = afroflight32
custom_helm_freertos_port = ARM_CM3
custom_helm_fpu_flags =
; bootloader: no implementation for F103 yet (would need its own
; from-real-source derivation and bench verification, same standard as
; every other register-level decision here -- see lib/bootloader/
; stm32h7.c's header comment). Kept in lib_ignore anyway so LDF never
; tries to auto-scan that folder for this board -- one name per line, see
; matek_h743's own comment on why (space-separated on one line silently
; ignores nothing). lib/rx/ is deliberately NOT in this list -- see this
; file's header comment.
;
; usb_cdc DOES have an F103 implementation as of #12 (lib/usb_cdc/
; stm32f1.c) -- transport only, tracked separately from the CLI itself
; (#13) the same way #3/#1 split it for matek_h743. NOT native USB,
; unlike matek_h743's: this board's "USB" port is an onboard USB-serial
; converter chip wired to a plain UART, confirmed against
; aoa-boat-controller's real firmware for this exact physical board --
; see stm32f1.c's own header comment for the full story (an earlier,
; wrong version of this env pointed custom_helm_stm32cube_package at
; framework-stm32cubef1 for a native-USB approach that was never correct
; for this board; removed once that was caught). custom_helm_usb_cdc
; below wires it in the same explicit-selection way as matek_h743's env,
; minus that option -- see scripts/add_usb_cdc.py's own comment for how
; its absence here is read as "not native USB," not a missing option.
; Still stays in lib_ignore below regardless -- same reasoning as
; bootloader/cli: lib/usb_cdc/ now holds both stm32h7.c and stm32f1.c,
; and add_usb_cdc.py explicitly compiles only the one this env names, so
; LDF must never be allowed to auto-scan the folder itself (matek_h743's
; env keeps the same line for the same reason, even though it has an
; implementation too).
;
; cli itself is NOT in this list, unlike bootloader/usb_cdc above --
; HELM_FEATURE_CLI flipped on as of #13, so lib/cli needs to actually
; compile for this board now, the same normal LDF auto-scan (no
; lib_ignore/custom_helm_cli) matek_h743's env already relies on for it.
; It was kept ignored here before #13 landed specifically because
; PlatformIO's LDF does a naive #include scan that doesn't understand
; src/main.c's own `#if HELM_FEATURE_CLI` guard, and would have compiled
; it as dead code with the flag still off (bench-confirmed -- issue #2);
; that reasoning no longer applies now that the flag is genuinely on.
custom_helm_usb_cdc = stm32f1
; This board's real onboard IMU (issue #27) -- see lib/sensors/mpu6500.c
; and board.h's board_i2c2_*() comment.
custom_helm_imu = mpu6500
lib_ignore =
    bootloader
    usb_cdc
    sensors
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_usb_cdc.py
    pre:scripts/add_sensors.py

; Not yet buildable on purpose: boards/nexus_xr/board.c #errors rather
; than guess at an unconfirmed HSE crystal value or pin map. See that
; file and boards/nexus_xr/board.h for what's actually known vs.
; speculative. Env kept here so the target is structurally present (repo
; supports it, `pio run -e nexus_xr` finds it) without pretending a real
; port exists yet.
[env:nexus_xr]
platform = ststm32
board = nucleo_f722ze ; placeholder: correct MCU FAMILY (STM32F722, same
                      ; family as the real STM32F722RET6) and correct HAL
                      ; (stm32f7xx), but a different package (ZET6 vs the
                      ; real RET6) and NOT the real board -- no PlatformIO
                      ; board def exists for the actual Nexus-XR. Swap for
                      ; a real/custom board JSON once pin/clock data is
                      ; confirmed.
framework = stm32cube
build_flags =
    -Iboards/nexus_xr
custom_helm_board = nexus_xr
custom_helm_freertos_port = ARM_CM7/r0p1
custom_helm_fpu_flags = -mfpu=fpv5-sp-d16 -mfloat-abi=hard
; CRSF, not SBUS -- the XR's onboard ExpressLRS receiver uses CRSF framing
; (see boards/nexus_xr/board.h, boards/nexus_xr/board_features.h's
; HELM_RX_DEFAULT_PROTOCOL_CRSF, and aoa-boat-controller's
; docs/nexus-xr-exploration.md). This is why RX had to be runtime-
; pluggable per board in the first place, not hardcoded to
; matek_h743/afroflight32's SBUS.
; bootloader/usb_cdc: neither ported to STM32F722 -- no implementation and
; no board on the bench to derive/verify one against (see this board's own
; hardware #error). cli is also ignored: HELM_FEATURE_CLI is 0 here, and
; PlatformIO's LDF does a naive #include scan that doesn't understand
; src/main.c's own `#if HELM_FEATURE_CLI` guard, so without this, lib/cli
; would get pulled in and compiled as dead code anyway (issue #2's bug,
; same reasoning matek_h743/afroflight32's envs don't need this line for
; -- their CLI flag is actually on). This board is blocked well before a
; CLI port would even be reachable regardless. sensors is ignored for the
; same "LDF's naive #include scan doesn't understand the #if guard"
; reason as cli -- HELM_HAS_IMU is 0 here (board_features.h), but without
; this, PlatformIO's default auto-scan would compile lib/sensors/ as one
; library unit and collide at link time the moment it holds more than one
; chip file (icm42688p.c/stub.c both define imu_chip_init()) -- exactly
; the failure mode lib/README.md's template exists to avoid. custom_helm_
; imu is deliberately not set here either -- scripts/add_sensors.py's
; "stub" default applies, harmlessly unreachable code same as everywhere
; else this board is blocked well before it'd matter.
lib_ignore =
    bootloader
    usb_cdc
    cli
    sensors
extra_scripts =
    pre:scripts/add_board.py
    pre:scripts/add_freertos.py
    pre:scripts/add_sensors.py
